<script>
/* Անվան նկարների ռոտացիա */
(function(){
  const INTERVAL = 2600;
  const shots = document.querySelectorAll('#chip img');
  if(!shots.length) return;
  shots[0].classList.add('on');
  if(shots.length < 2) return;
  let i = 0;
  setInterval(() => {
    shots[i].classList.remove('on');
    i = (i + 1) % shots.length;
    shots[i].classList.add('on');
  }, INTERVAL);
})();

/* Անունը միշտ տեղավորվում է էկրանին */
(function(){
  const el = document.querySelector('.name');
  if(!el) return;
  const FILL = 0.9, words = el.querySelectorAll('.w');
  function fit(){
    const stacked = window.innerWidth < 640;
    el.style.fontSize = '100px';
    const target = el.parentElement.clientWidth * FILL;
    let measured = el.offsetWidth;
    if(stacked){ measured = 0; words.forEach(w => { if(w.offsetWidth > measured) measured = w.offsetWidth; }); }
    el.style.fontSize = (100 * target / measured) + 'px';
  }
  fit();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('resize', fit);
})();
</script>
