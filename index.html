<script>
/* Անվան նկարների ռոտացիա */
(function(){
  const INTERVAL = 2600;
  const shots = document.querySelectorAll('#chip img');
  if(!shots.length) return;
  shots[0].classList.add('on');
  if(shots.length < 2) return;
  const still = window.matchMedia('(prefers-reduced-motion: reduce)');
  let i = 0, timer = null;
  function tick(){
    shots[i].classList.remove('on');
    i = (i + 1) % shots.length;
    shots[i].classList.add('on');
  }
  // կանգնում է, երբ էջը չի երևում կամ միացված է «Reduce motion»-ը
  function start(){ if(!timer && !document.hidden && !still.matches) timer = setInterval(tick, INTERVAL); }
  function stop(){ clearInterval(timer); timer = null; }
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  const nm = document.querySelector('.name');
  nm.addEventListener('mouseenter', stop); nm.addEventListener('mouseleave', start);   // կանգնում է մկնիկը վրան պահելիս
  if(still.addEventListener) still.addEventListener('change', () => still.matches ? stop() : start());
  start();
})();

/* Անունը միշտ տեղավորվում է էկրանին */
(function(){
  const el = document.querySelector('.name');
  if(!el) return;
  const FILL = 0.9, words = el.querySelectorAll('.w');
  function fit(){
    const stacked = window.innerWidth < 640;
    el.style.fontSize = '100px';
    const target = el.parentElement.clientWidth * FILL;
    let measured = el.offsetWidth;
    if(stacked){ measured = 0; words.forEach(w => { if(w.offsetWidth > measured) measured = w.offsetWidth; }); }
    el.style.fontSize = (100 * target / measured) + 'px';
  }
  fit();
  // ցույց տալ անունը միայն այն բանից հետո, երբ տառատեսակը և չափը պատրաստ են (առավելագույնը 300ms)
  const go = () => el.classList.add('go');
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); go(); });
  setTimeout(go, 300);
  window.addEventListener('resize', fit);
})();
</script>
