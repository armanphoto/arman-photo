<style>
:root{--ink:#0A0A0A;--muted:#8A8A8A;--line:#E4E4E4}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100svh}
a{color:inherit;text-decoration:none}
img{display:block}
.wrap{max-width:440px;margin:0 auto;padding:44px 20px 40px;display:flex;flex-direction:column;align-items:center}
.av{width:116px;height:116px;border-radius:50%;object-fit:cover;background:#efefef}
h1{margin-top:18px;font-size:1.5rem;font-weight:700;letter-spacing:-.03em;text-align:center}
.role{margin-top:6px;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.tel{margin-top:14px;font-size:1.35rem;letter-spacing:-.01em}
.stack{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:12px}
.pill{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border:1.5px solid var(--ink);border-radius:999px;font-size:.78rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-align:center;transition:background .2s,color .2s}
.pill:hover,.pill:focus-visible{background:var(--ink);color:#fff}
.pill.solid{background:var(--ink);color:#fff}
.pill.solid:hover{background:#fff;color:var(--ink)}
.note{margin-top:14px;font-size:.78rem;color:var(--muted);text-align:center;line-height:1.5}
.h{width:100%;margin:34px 0 12px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:#efefef}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.cat:hover img{transform:scale(1.03)}
.cat span{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 12px;color:#fff;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.foot{margin-top:40px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fade{opacity:0;transform:translateY(8px);animation:in .6s ease forwards}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}.cat img{transition:none}}
</style>
