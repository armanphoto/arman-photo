:root{--ink:#0A0A0A;--muted:#8A8A8A;--line:#E4E4E4}

.pill:active{transform:scale(.97)}
.pill.solid{background:var(--ink);color:#fff}
.note{margin-top:14px;font-size:.78rem;color:var(--muted);text-align:center;line-height:1.5}
.soc{width:100%;margin-top:28px;display:flex;justify-content:center;gap:20px}
.soc a{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.soc .ic{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;color:var(--ink);display:grid;place-items:center;transition:background .2s,color .2s,transform .16s ease-out}
.soc svg{fill:currentColor;display:block}
.soc .tg{width:30px;height:30px;margin-left:-3px}
.soc .fb{width:17px;height:27px}
.soc .px{width:44px;height:44px}
.soc .wa{width:28px;height:28px}
.soc a:focus-visible .ic{background:var(--ink);color:#fff}
.soc a:active .ic{transform:scale(.97)}
.h{width:100%;margin:34px 0 12px;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.cats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:#efefef}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .3s cubic-bezier(.23,1,.32,1)}
.cat span{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 12px;color:#fff;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.foot{margin-top:40px;text-align:center;line-height:2.2;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fade{opacity:0;transform:translateY(14px);animation:in .45s cubic-bezier(.23,1,.32,1) forwards}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}
@keyframes in{to{opacity:1;transform:none}}
@media (hover:hover) and (pointer:fine){.pill:hover,.soc a:hover .ic{background:var(--ink);color:#fff}.pill.solid:hover{background:#fff;color:var(--ink)}.cat:hover img{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1;transform:none}.cat img,.cat:hover img{transition:none;transform:none}.pill,.soc .ic{transition:background .2s,color .2s}.pill:active,.soc a:active .ic{transform:none}}
