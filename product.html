<script>
(function(){
  const CAT='product', TOTAL=19;
  const lb=document.getElementById('lb'),im=document.getElementById('lbI'),c=document.getElementById('lbC');
  let cur=1; const pad=n=>String(n).padStart(2,'0');
  function show(n){cur=((n-1+TOTAL)%TOTAL)+1;im.src='assets/img/'+CAT+'/'+pad(cur)+'.webp';
    c.textContent=pad(cur)+' / '+pad(TOTAL);}
  function open(n){show(n);lb.classList.add('open');document.body.style.overflow='hidden';}
  function close(){lb.classList.remove('open');document.body.style.overflow='';}
  document.querySelectorAll('.grid button').forEach(b=>b.addEventListener('click',()=>open(+b.dataset.n)));
  document.getElementById('lbX').onclick=close;
  document.getElementById('lbP').onclick=()=>show(cur-1);
  document.getElementById('lbN').onclick=()=>show(cur+1);
  lb.addEventListener('click',e=>{if(e.target===lb)close();});
  document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1);});
})();
</script>
