<script>
(function(){
  const CAT='portrait', TOTAL=21;
  const lb=document.getElementById('lb'),
        im=document.getElementById('lbI'),
        c =document.getElementById('lbC');
  let cur=1;
  const pad=n=>String(n).padStart(2,'0');
  const src=n=>'assets/img/'+CAT+'/'+pad(n)+'.webp';

  // հարևան կադրերը նախապես բեռնել, որ թերթելը ակնթարթային լինի
  function preload(n){
    [n-1,n+1].forEach(k=>{
      if(k>=1 && k<=TOTAL){ const i=new Image(); i.src=src(k); }
    });
  }
  function show(n){
    cur = ((n-1+TOTAL)%TOTAL)+1;
    im.src = src(cur);
    c.textContent = pad(cur)+' / '+pad(TOTAL);
    lb.classList.toggle('first', cur===1);
    lb.classList.toggle('last',  cur===TOTAL);
    preload(cur);
  }
  function open(n){ show(n); lb.classList.add('open'); document.body.style.overflow='hidden'; }
  function close(){ lb.classList.remove('open'); document.body.style.overflow=''; }

  document.querySelectorAll('.grid button').forEach(b=>
    b.addEventListener('click',()=>open(+b.dataset.n)));
  document.getElementById('lbX').onclick=close;
  document.getElementById('lbP').onclick=e=>{ e.stopPropagation(); show(cur-1); };
  document.getElementById('lbN').onclick=e=>{ e.stopPropagation(); show(cur+1); };
  lb.addEventListener('click',e=>{ if(e.target===lb) close(); });

  document.addEventListener('keydown',e=>{
    if(!lb.classList.contains('open')) return;
    if(e.key==='Escape')      close();
    if(e.key==='ArrowLeft')   show(cur-1);
    if(e.key==='ArrowRight')  show(cur+1);
  });

  // մատով թերթել հեռախոսին
  let x0=null, y0=null;
  lb.addEventListener('touchstart',e=>{
    x0=e.changedTouches[0].clientX; y0=e.changedTouches[0].clientY;
  },{passive:true});
  lb.addEventListener('touchend',e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0;
    const dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)) show(cur + (dx<0 ? 1 : -1));
    else if(dy>90 && Math.abs(dy)>Math.abs(dx)) close();   // ներքև քաշելը փակում է
    x0=y0=null;
  },{passive:true});
})();
</script>
